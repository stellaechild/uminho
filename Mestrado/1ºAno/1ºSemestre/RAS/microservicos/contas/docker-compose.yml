version: '3'

networks:
  gestaocontasnet:
    driver: bridge

services:
  mysql:
    image: mysql:latest
    container_name: GestaoDeContasDB
    networks:
      - gestaocontasnet
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: gestao
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: GestaoDeContasDB
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      
  gestaocontas:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestaocontas:latest
    container_name: GestaoDeContas
    restart: on-failure
    networks:
      - gestaocontasnet
    ports:
      - "8000:8000"
    # depends_on:
    #   - mysql

