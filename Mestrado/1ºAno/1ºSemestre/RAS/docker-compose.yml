version: '3'
services:
  frontend:
    build: ./microservicos/frontend
    ports:
      - 80:80
    volumes:
      - ./microservicos/frontend:/src
    environment:
      - PORT=80
      - TZ=Europe/Lisbon
  mysql-gestaocontas:
    image: mysql:latest
    container_name: GestaoDeContasDB
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: gestao
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: GestaoDeContasDB
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
  gestaocontas-api:
    build:
      context: ./microservicos/contas
      dockerfile: Dockerfile
    image: gestaocontas:latest
    container_name: GestaoDeContas
    restart: on-failure
    ports:
      - "8000:8000"